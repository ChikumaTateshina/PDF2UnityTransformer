name: Release

# Push a tag equal to Packages/<id>/package.json "version" (e.g. 0.1.1) to publish a release.
# The VPM listing is then rebuilt and deployed by listing.yml (runs on main, which the
# github-pages environment allows; tag refs are rejected by its protection rules).
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_ID: com.chikumatateshina.pdf2unitytransformer

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          VERSION=$(jq -r .version "Packages/$PACKAGE_ID/package.json")
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="$PACKAGE_ID-$VERSION.zip"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$ZIP"
          cd "Packages/$PACKAGE_ID"
          jq --arg url "$URL" '.url = $url' package.json > "$RUNNER_TEMP/package.json"
          cp "$RUNNER_TEMP/package.json" package.json
          zip -r -X "$GITHUB_WORKSPACE/$ZIP" . -x '*__pycache__*' '*.pyc'
          cp package.json "$GITHUB_WORKSPACE/package.json"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" "$PACKAGE_ID-$VERSION.zip" package.json \
            --title "$VERSION" \
            --notes "Add the VPM listing to VRChat Creator Companion: https://chikumatateshina.github.io/PDF2UnityTransformer/index.json"
